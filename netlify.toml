[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.x"

# Redirect rules for Single Page Application (SPA) routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Function rewrite endpoint for Netlify Serverless Proxy
[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/gemini/:splat"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
